name: Hospital helipads (OpenStreetMap)
on:
  workflow_dispatch:   # manual only – automatic runs switched off by the staff (22 Nov): OpenStreetMap download failing, waiting for the staff's list
permissions:
  contents: write
jobs:
  helipads:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tools/helipad_build.py data/helipads.json
      - name: Commit the helipads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/helipads.json
          git diff --cached --quiet || git commit -m "Hospital helipads (OpenStreetMap, ODbL) [skip ci]"
          git pull --rebase && git push
