<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IVAO SO – Training Mission Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;800&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* --- Leaflet 1.9 essential styles (inlined) --- */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;outline-offset:1px;font:12px/1.5 system-ui,Arial,sans-serif}
.leaflet-marker-icon,.leaflet-marker-shadow{display:block;user-select:none}
.leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}
.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right}.leaflet-top .leaflet-control{margin-top:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}
.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:10px}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}
.leaflet-dragging .leaflet-grab,.leaflet-dragging .leaflet-marker-draggable{cursor:move}
.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-image-layer,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}
.leaflet-bar{box-shadow:0 1px 5px rgba(0,0,0,.65);border-radius:4px}
.leaflet-bar a{background:#16213a;color:#e5e7eb;border-bottom:1px solid #24324a;width:28px;height:28px;line-height:28px;display:block;text-align:center;text-decoration:none}
.leaflet-bar a:last-child{border-bottom:none}
.leaflet-control-zoom-in,.leaflet-control-zoom-out{font:bold 18px monospace}
.leaflet-control-attribution{background:rgba(11,18,32,.75);color:#94a3b8;margin:0;padding:0 5px;font-size:10px}
.leaflet-control-attribution a{color:#94a3b8}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}
.leaflet-popup-content-wrapper{padding:1px;text-align:left;border-radius:10px}
.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-top:-1px;margin-left:-20px;overflow:hidden;pointer-events:none}
.leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;pointer-events:auto;transform:rotate(45deg)}
.leaflet-container a.leaflet-popup-close-button{position:absolute;top:0;right:0;border:none;text-align:center;width:24px;height:24px;font:16px/24px Tahoma,sans-serif;color:#94a3b8;text-decoration:none;background:transparent}
.leaflet-tooltip{position:absolute;padding:4px 7px;background:#111a2b;border:1px solid #24324a;border-radius:4px;color:#e5e7eb;white-space:nowrap;user-select:none;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.leaflet-fade-anim .leaflet-popup{opacity:0;transition:opacity .2s linear}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup{opacity:1}
/* --- IVAO brand theme (IVAO blue #0D2C99 + white, Poppins / Nunito Sans) --- */
:root{--ivao:#0D2C99;--ivao2:#1B3FBF;--bg:#F3F5FA;--panel:#FFFFFF;--panel2:#EEF2FA;--line:#D5DCEA;--text:#16203A;--muted:#5A6684;
  --blue:#2563EB;--red:#D92D2D;--amber:#D97706;--green:#15803D}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13.5px/1.5 Poppins,system-ui,Arial,sans-serif}
h1,h2,h3,.brand{font-family:'Nunito Sans',Poppins,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--ivao);color:#fff;flex-wrap:wrap}
header .brand{display:flex;align-items:center;gap:10px;margin-right:6px}
header .brand img{width:38px;height:38px}
header h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.01em;line-height:1.15}
header h1 small{display:block;font:500 11px Poppins,sans-serif;opacity:.8;letter-spacing:.04em}
.demo-badge{background:#fff;color:var(--ivao);font:800 10px 'Nunito Sans',sans-serif;padding:2px 7px;border-radius:4px;letter-spacing:.08em;margin-left:6px;vertical-align:middle}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font:500 12.5px Poppins,sans-serif}
nav button:hover{background:rgba(255,255,255,.12)}
nav button.on{background:#fff;color:var(--ivao);border-color:#fff;font-weight:600}
header #demo{margin-left:auto;}
header #demo,header #gopublic{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45)}
#staffview{height:100%;display:flex;flex-direction:column;overflow:hidden}#staffview>header{flex:0 0 auto}
main{display:grid;grid-template-columns:minmax(380px,530px) 1fr;flex:1 1 auto;min-height:0}
#mapfit{position:absolute;left:12px;bottom:14px;z-index:800;background:#fff;color:var(--ivao);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:600 12px Poppins,sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#panel{overflow:auto;padding:16px 18px;border-right:1px solid var(--line);background:var(--panel)}
#mapwrap{position:relative}
#map{position:absolute;inset:0;background:#D9E4F5}
#maptools{position:absolute;top:10px;right:10px;z-index:1000;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:440px;box-shadow:0 2px 8px rgba(13,44,153,.12)}
#nomap{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:40px}
h2{font-size:15px;margin:20px 0 8px;color:var(--ivao);font-weight:800}
h2:first-child{margin-top:0}
label{display:block;color:var(--muted);font-size:12px;margin:8px 0 3px}
input,select,textarea{width:100%;background:#fff;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(13,44,153,.25);border-color:var(--ivao)}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{flex:1}
.row>.shrink{flex:0 0 auto}
button.b{background:#fff;border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:6px;cursor:pointer;font:500 13px Poppins,sans-serif;white-space:nowrap}
button.b:hover{border-color:var(--ivao);color:var(--ivao)}
label.b{display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;color:var(--text);font:500 13px Poppins,sans-serif;margin:0}
label.b:hover{border-color:var(--ivao);color:var(--ivao)}
button.b:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--ivao);border-color:var(--ivao);color:#fff;font-weight:600}
button.primary:hover{background:var(--ivao2);color:#fff}
button.danger{color:var(--red)}
button.sm{padding:3px 8px;font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0}
.muted{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12.5px;cursor:pointer}
.chip input{width:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);padding:4px 5px;text-align:left;vertical-align:middle}
th{color:#fff;background:var(--ivao);font-weight:600}
td input,td select{padding:3px 5px;font-size:12.5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.blue{color:#1D4ED8}.red{color:#B91C1C}.amber{color:#B45309}.green{color:#15803D}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.subtabs button{font-size:12px;padding:4px 9px}
.warn{background:#FFF6E5;border:1px solid #F3C677;color:#7A4A00;border-radius:6px;padding:6px 9px;margin:4px 0;font-size:12.5px}
.ok{background:#EAF7EF;border:1px solid #9AD5AE;color:#166534;border-radius:6px;padding:6px 9px;margin:4px 0;font-size:12.5px}
[hidden]{display:none!important}
#evpanel{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:4000;display:flex;align-items:flex-start;justify-content:center;padding:60px 14px;overflow:auto}#evpanel[hidden]{display:none}.evbox{background:#fff;border-radius:12px;padding:18px;max-width:860px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}.evbox table td{vertical-align:top}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ivao);color:#fff;padding:8px 14px;border-radius:8px;display:none;z-index:5000;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#fff;color:var(--text);border:1px solid var(--line);box-shadow:0 3px 14px rgba(0,0,0,.2)}
.leaflet-popup-content{margin:10px 12px;min-width:220px}
.leaflet-popup-content label{margin:5px 0 2px}
.leaflet-tooltip{background:#fff!important;color:var(--text)!important;border-color:var(--line)!important}
.leaflet-bar a{background:#fff!important;color:var(--ivao)!important;border-bottom-color:var(--line)!important}
.leaflet-control-attribution{background:rgba(255,255,255,.8)!important;color:var(--muted)!important}
.mk{display:flex;align-items:center;justify-content:center;font:700 10px Arial;color:#fff;border:2px solid #fff;border-radius:50%;box-shadow:0 0 3px rgba(0,0,0,.5)}
.mklabel{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:4px;white-space:nowrap;color:#0B1530;font:600 11px Poppins,Arial;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff}
.intro{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.intro ol{margin:6px 0 0 18px;padding:0}.intro li{margin:2px 0}
details summary{cursor:pointer;margin:6px 0}
/* --- public page --- */
#publicview{background:var(--bg);min-height:100%}
.pv-banner{position:sticky;top:0;z-index:2000;background:#FFF6E5;border-bottom:1px solid #F3C677;color:#7A4A00;padding:8px 16px;display:flex;gap:12px;align-items:center;justify-content:center;font-size:13px}
.hero{background:var(--ivao);color:#fff;padding:34px 20px 26px}
.hero-in{max-width:1100px;margin:0 auto;display:flex;gap:22px;align-items:center}
.hero-in img{width:96px;height:96px;flex:0 0 auto}
.eyebrow{font:700 12px 'Nunito Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.hero h1{font:800 34px/1.1 'Nunito Sans',sans-serif;margin:6px 0 6px}
.hero .sub{margin:0;opacity:.9;font-size:14px}
.hero .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:2px 10px;font-size:12px}
.dl{max-width:1100px;margin:20px auto 0;display:flex;gap:10px;flex-wrap:wrap}
.dl button{background:#fff;color:var(--ivao);border:0;border-radius:8px;padding:10px 16px;font:600 14px Poppins,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;min-width:210px}
.dl button small{font:400 11.5px Poppins,sans-serif;color:var(--muted)}
.dl button:hover{box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.dl button:disabled{opacity:.6;cursor:wait}
#pubstatus{max-width:1100px;margin:8px auto 0;min-height:18px;font-size:12.5px;opacity:.9}
.pub{max-width:1100px;margin:0 auto;padding:22px 20px 40px;display:grid;gap:18px;grid-template-columns:1fr 1fr;height:auto!important}
.pub>.pcard:nth-child(2){grid-row:span 1}
.pcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.pcard h2{margin:0 0 10px;font-size:19px}
.pcard p{margin:0 0 10px}
.factions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.fac{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.fac b{display:block;font-family:'Nunito Sans',sans-serif;font-size:15px}
.fac.blue-f{border-color:#BFD3FB;background:#F2F6FF}.fac.red-f{border-color:#F6C4C4;background:#FFF4F4}
.pmapwrap{position:relative;height:460px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#D9E4F5}
#pmap{position:absolute;inset:0}
.pmapwrap img{width:100%;height:100%;object-fit:contain}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tcard{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tcard b{font-family:'Nunito Sans',sans-serif;color:var(--ivao)}
.tcard p{margin:6px 0 0;font-size:13px}
.tcard .resp{color:var(--muted);font-size:12.5px}
.pfoot{max-width:1100px;margin:0 auto;padding:0 20px 30px;color:var(--muted);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}
.pfoot a{color:var(--ivao)}
.pub a{color:var(--ivao)}
.tablewrap{overflow-x:auto}
@media (max-width:900px){.pub{grid-template-columns:1fr}}
@media (max-width:700px){.hero-in{flex-direction:column;align-items:flex-start}.hero h1{font-size:26px}.factions{grid-template-columns:1fr}.dl button{min-width:0;flex:1 1 100%}}
@media (max-width:900px){#staffview{height:auto;overflow:visible}main{grid-template-columns:1fr;grid-template-rows:auto 60vh;height:auto}#mapwrap{height:60vh;position:sticky;top:0}#panel{overflow:visible}}
</style>
</head>

const RE = 6371, rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
function dest([lat, lon], brg, km) {
  const d = km / RE, b = rad(brg), p1 = rad(lat), l1 = rad(lon);
  const p2 = Math.asin(Math.sin(p1) * Math.cos(d) + Math.cos(p1) * Math.sin(d) * Math.cos(b));
  const l2 = l1 + Math.atan2(Math.sin(b) * Math.sin(d) * Math.cos(p1), Math.cos(d) - Math.sin(p1) * Math.sin(p2));
  return [+deg(p2).toFixed(5), +deg(l2).toFixed(5)];
}
function dist(a, b) {
  const dp = rad(b[0] - a[0]), dl = rad(b[1] - a[1]);
  const h = Math.sin(dp / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dl / 2) ** 2;
  return 2 * RE * Math.asin(Math.sqrt(h));
}

}

let CUSTOM_ALIASES = lsGet('ivao-so-aliases', {}); // normalized raw -> AC type name
const norm = s => String(s || '').toUpperCase().replace(/^\s*(TIPO|TYPE|T\.)\s+/, '').replace(/[^A-Z0-9]/g, '');
function resolveType(raw) {
  const n = norm(raw); if (!n) return null;
  if (CUSTOM_ALIASES[n]) return AC.find(a => a.type === CUSTOM_ALIASES[n]) || null;
  for (const a of AC) if (norm(a.type) === n || a.aliases.includes(n)) return a;
  let best = null, bl = 0; // prefix match, longest alias wins (F35B before F35)
  for (const a of AC) for (const al of a.aliases) if (al.length >= 2 && n.startsWith(al) && al.length > bl) { best = a; bl = al.length; }
  return best;
}

let POINTS = lsGet('ivao-so-points', null) || { source: '', items: [] }; // items: [name, type, lat, lon, extra]
function sctCoord(str) {
  const m = String(str).trim().match(/^([NSEW])\s?(\d{1,3})[.:](\d{1,2})[.:](\d{1,2})(?:[.:](\d+))?$/i);
  if (m) { const v = +m[2] + +m[3] / 60 + (+m[4] + (m[5] ? +('0.' + m[5]) : 0)) / 3600; return /[SW]/i.test(m[1]) ? -v : v; }
  const d = parseFloat(str); return isNaN(d) ? null : d;
}
function parseSector(text) {
  const items = []; let sec = '';
  const FIXSEC = /^(FIXES?|VFR.*|VRP.*|REPORTING.*|WAYPOINTS?|INTERSECTIONS?)$/;
  for (let line of text.split(/\r?\n/)) {
    line = line.replace(/;.*$/, '').trim(); if (!line) continue;
    const h = line.match(/^\[(.+)\]$/); if (h) { sec = h[1].trim().toUpperCase(); continue; }
    const f = line.split(/\s+/);
    if (sec === 'VOR' || sec === 'NDB') { if (f.length >= 4) { const la = sctCoord(f[2]), lo = sctCoord(f[3]); if (la != null && lo != null) items.push([f[0], sec, +la.toFixed(5), +lo.toFixed(5), f[1]]); } }
    else if (sec === 'AIRPORT') { if (f.length >= 4) { const la = sctCoord(f[2]), lo = sctCoord(f[3]); if (la != null && lo != null) items.push([f[0], 'APT', +la.toFixed(5), +lo.toFixed(5), f[1]]); } }
    else if (FIXSEC.test(sec)) { if (f.length >= 3) { const la = sctCoord(f[1]), lo = sctCoord(f[2]); if (la != null && lo != null) items.push([f[0], /VFR|VRP|REPORTING/.test(sec) ? 'VFR' : 'FIX', +la.toFixed(5), +lo.toFixed(5), '']); } }
  }
  return items;
}
function parsePointsJson(j) {
  const arr = Array.isArray(j) ? j : (j && (j.points || j.fixes)) || [];
  return arr.map(x => { if (Array.isArray(x)) return x; const la = x.lat != null ? +x.lat : sctCoord(x.latitude), lo = x.lon != null ? +x.lon : sctCoord(x.longitude);
    return (la != null && lo != null && x.name) ? [String(x.name).toUpperCase(), String(x.type || 'FIX').toUpperCase(), +la.toFixed(5), +lo.toFixed(5), x.freq || ''] : null; }).filter(Boolean);
}
function setPoints(items, source) {
  POINTS = { source, items, loaded: new Date().toISOString() };
  try { localStorage.setItem('ivao-so-points', JSON.stringify(POINTS)); } catch (e) { }
}
async function loadPointsApi(url, token) {
  const r = await fetch(url, { headers: token ? { Authorization: 'Bearer ' + token } : {} });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const ct = r.headers.get('content-type') || ''; const txt = await r.text();
  return /json/.test(ct) || /^\s*[\[{]/.test(txt) ? parsePointsJson(JSON.parse(txt)) : parseSector(txt);
}
function pointsAll() {
  if (POINTS.items.length) return POINTS.items;
  const a = Object.entries(AIRPORTS).map(([k, v]) => [k, 'APT', v[1], v[2], '']);
  const b = BUL().map(x => [x.ref || x.name, 'REF', x.pos[0], x.pos[1], x.name]);

}
const SYL = ['KO', 'RA', 'MI', 'TU', 'LE', 'SO', 'VA', 'NI', 'DE', 'PO', 'GA', 'RE', 'BU', 'LI', 'ZA', 'FE'];
const synthName = used => { let n; do { n = pick(SYL) + pick(SYL) + pick(['N', 'R', 'S', 'T', 'L']); } while (used.has(n)); used.add(n); return n; };
function inReserved(p) { const R = RES(); return R.length ? R.some(z => z.poly && pip(p, z.poly)) : dist(p, geom().front) < 120; }
// route of n reference points chained between 8 and 70 km, all inside the reserved areas
function routePoints(n, st, prefer, zs) { // zs: keep the route inside these areas (e.g. very low level tactical areas)
  const g = geom(); st.used = st.used || new Set(); st.syn = st.syn || 0; zs = (zs || []).filter(z => z.poly);
  const inZ = p => zs.length ? zs.some(z => pip(p, z.poly)) : inReserved(p);
  const inside = (base, rKm) => { const z = zs.slice().sort((a, b) => dist(base, centroid(a.poly)) - dist(base, centroid(b.poly)))[0], b = pbox(z.poly);
    for (let i = 0; i < 400; i++) { const q = [b[0] + Math.random() * (b[1] - b[0]), b[2] + Math.random() * (b[3] - b[2])]; if (pip(q, z.poly) && (i > 200 || dist(base, q) <= rKm)) return q; } return centroid(z.poly); };
  let pool = pointsAll().filter(x => !/APT/.test(x[1]) || POINTS.items.length === 0).filter(x => inZ([x[2], x[3]]));

    if (cur) { const near = c.filter(x => { const d = dist(cur.pos, [x[2], x[3]]); return d >= 8 && d <= 70; }); if (near.length) c = near; else c = []; }
    if (c.length) { const x = pick(c); cur = { name: x[0], pos: [x[2], x[3]], type: x[1] }; }

const ATC_RE = /\b(ATC|CTR|APP|TWR|GND|GCI|AWACS|JTAC|CONTROLLER|CONTROLLORE|CONTROLLO|RADAR)\b/i;

function renderScenario() {

function ringsFromGeo(fc, skip) {

    const id = f.id || (f.properties && (f.properties.id || f.properties.iso_a2)) || '';
    if (skip && skip(id)) continue;
    const g = f.geometry; if (!g) continue;
    const polys = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
    for (const poly of polys) for (const ring of poly) {
      const pts = ring.map(([lon, lat]) => [lat, lon]);
      if (pts.some(([la, lo]) => la > BBOX[0] && la < BBOX[1] && lo > BBOX[2] && lo < BBOX[3])) out.push({ id, pts });

}
function decodeEcharts(json) { // ECharts 4 UTF8-encoded geojson

  return json;
}
